<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>

    <style>
      .card {
        width: 280px;
        padding: 16px;
        background-color: #fff3cd;
        border: 2px solid #856404;
        border-radius: 12px;
      }
    </style>
  </head>

  <body>
    <main>
      <article class="card">
        <h3>Card Title</h3>
        <p>This is a simple card with rounded corners.</p>
      </article>
    </main>
  </body>
</html>
