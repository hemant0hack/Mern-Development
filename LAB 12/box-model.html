<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>
    <style>
      .content,
      .border {
        width: 200px;
        padding: 20px;
        border: 5px solid black;
        margin-bottom: 15px;
        background: #e8f0fe;
      }
      .content {
        box-sizing: content-box;
      }
      .border {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="content">content-box: total width 250px</div>
    <div class="border">border-box: total width 200px</div>
  </body>
</html>
