<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marks Accessible</title>
    <style>
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #444;
        padding: 6px 14px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Marks of Class A
      </caption>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Maths</th>
          <th scope="col">Science</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Hemant</th>
          <td>78</td>
          <td>85</td>
        </tr>
        <tr>
          <th scope="row">Rohan</th>
          <td>64</td>
          <td>70</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
