<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <style>
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .gallery div {
        border: 1px solid #333;
        padding: 20px;
        background: #dbeafe;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Club Photo Gallery</h1>
    <div class="gallery">
      <div>Photo 1</div>
      <div>Photo 2</div>
      <div>Photo 3</div>
      <div>Photo 4</div>
      <div>Photo 5</div>
      <div>Photo 6</div>
    </div>
  </body>
</html>
