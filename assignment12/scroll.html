<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Box</title>

    <style>
      .box {
        width: 250px;
        height: 120px;
        padding: 8px;
        overflow: auto;
        border: 2px solid #333;
      }
    </style>
  </head>

  <body>
    <main>
      <section class="box" aria-label="Scrollable list of lines">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
      </section>
    </main>
  </body>
</html>
