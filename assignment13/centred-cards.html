<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centred Cards</title>
    <style>
      .row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        height: 250px;
        border: 2px dashed #999;
      }
      .card {
        border: 1px solid #888;
        border-radius: 8px;
        padding: 16px;
        width: 150px;
        text-align: center;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="card">
        <h3>Starter</h3>
        <p>199</p>
      </div>
      <div class="card">
        <h3>Standard</h3>
        <p>349</p>
      </div>
      <div class="card">
        <h3>Premium</h3>
        <p>499</p>
      </div>
    </div>
  </body>
</html>
